; M5Stack Cardputer v1.1 (StampS3A) - programmable macro pad
[env:cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv

; Native USB in TinyUSB (OTG) mode so the device can be a HID keyboard.
; CDC-on-boot must stay off: it would start USB before setup() and the HID
; interfaces could no longer be added. No USB serial port is created.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; sd/macropad.json is compiled in as the built-in default configuration.
extra_scripts =
    pre:tools/embed_config.py
    pre:tools/toolchain_path.py

lib_deps =
    m5stack/M5Cardputer @ ^1.1.1
    bblanchon/ArduinoJson @ ^7

; Diagnostic build: same firmware but USB stays a USB-Serial/JTAG console
; (no USB keyboard), so crash logs are visible on the COM port.
[env:diag]
extends = env:cardputer
build_unflags =
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMACROPAD_DIAG
